<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>MyCinema Backup</title>
</head>
<body style="background:#08070a; color:#f2eee9; font-family:sans-serif; text-align:center; padding:50px;">
  <h1>Експорт даних MyCinema</h1>
  <p style="color:#8d877f; margin-bottom: 30px;">Натисніть кнопку нижче, щоб зберегти поточний стан бібліотеки перед переїздом на Supabase.</p>
  
  <button id="btn" style="padding: 16px 32px; font-size: 18px; cursor: pointer; background: #ffb86c; color: #1a1207; border: none; border-radius: 12px; font-weight: bold; transition: 0.2s;">
    Завантажити Backup (JSON)
  </button>

  <script>
    document.getElementById('btn').onclick = () => {
      const payload = {
        mycinema_library: JSON.parse(localStorage.getItem('mycinema.library') || '{}'),
        mycinema_deleted: JSON.parse(localStorage.getItem('mycinema.deleted') || '{}'),
        mycinema_dismissed: JSON.parse(localStorage.getItem('mycinema.dismissed') || '{}'),
        mycinema_actorAdjustments: JSON.parse(localStorage.getItem('mycinema.actorAdjustments') || '{}'),
        mycinema_appearance: {
          theme: localStorage.getItem('mycinema.theme.bg'),
          accent: localStorage.getItem('mycinema.theme.accent')
        }
      };
      
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mycinema-migration-backup.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };
  </script>
</body>
</html>
