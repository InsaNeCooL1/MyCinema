<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyCinema · Плеєр</title>
<style>
  :root {
    --bg-0:#08070a; --bg-1:#0f0e13; --bg-2:#16141b; --bg-3:#201d28;
    --accent:#ffb86c; --accent-hover:#ffc98a; --accent-rgb:255,184,108;
    --text:#f2eee9; --text-secondary:#cfc8c0; --text-muted:#8d877f;
    --danger:#ff5c5c; --success:#9de5c3;
    --serif:'Georgia','Playfair Display',serif;
    --sans:system-ui,-apple-system,'Inter',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',monospace;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg-0); color:var(--text); font-family:var(--sans); }
  button { font-family:inherit; cursor:pointer; }

  #audio-wrap {
    position:absolute; z-index:26; top:58px; right:14px;
    display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted);
    background:rgba(8,7,10,.6); padding:5px 8px; border-radius:var(--r-sm);
  }
  #audio-wrap[hidden] { display:none; }
  #audio-sel {
    background:var(--bg-2); color:var(--text); border:1px solid rgba(255,255,255,.14);
    border-radius:var(--r-sm); padding:6px 8px; font:12px var(--sans); max-width:190px;
  }
  #audio-sel:hover { border-color:var(--accent); }

  #hud { position:absolute; z-index:26; left:14px; bottom:78px; display:flex; gap:6px; flex-wrap:wrap; max-width:70%; font:11px/1 var(--mono); color:var(--accent); }
  #hud[hidden] { display:none; }
  #hud span {
    background:rgba(8,7,10,.75); border:1px solid rgba(var(--accent-rgb),.22);
    padding:5px 7px; border-radius:var(--r-sm); white-space:nowrap;
  }
  #preload { position:absolute; z-index:27; top:0; left:0; right:0; height:2px; background:transparent; }
  #preload i { display:block; height:100%; width:0; background:var(--accent); transition:width .5s; }

  #stage { position:absolute; inset:0; background:#000; overflow:hidden; }
  video { width:100%; height:100%; object-fit:contain; background:#000; }

  /* Preloader у стилі MyCinema */
  #loader {
    position:absolute; inset:0; z-index:5;
    display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 35%, rgba(var(--accent-rgb),.10), transparent 55%), var(--bg-0);
    transition:opacity .45s ease;
  }
  #loader.hidden { opacity:0; pointer-events:none; }
  .loader-card {
    width:min(420px,86vw); text-align:center; padding:30px 26px;
    background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.012));
    border:1px solid rgba(var(--accent-rgb),.20); border-radius:var(--r-lg);
    box-shadow:0 24px 70px rgba(0,0,0,.6);
  }
  .loader-logo {
    font-family:var(--serif); font-style:italic; font-weight:800;
    font-size:30px; color:var(--accent); letter-spacing:-.5px;
  }
  .loader-logo small { font:12px var(--mono); color:var(--text-muted); font-style:normal; }
  .loader-sub { margin-top:16px; font-size:13px; color:var(--text-secondary); min-height:1.4em; }
  .loader-track {
    margin:18px auto 10px; height:5px; width:100%; border-radius:99px;
    background:rgba(255,255,255,.07); overflow:hidden;
  }
  .loader-track i {
    display:block; height:100%; width:18%; border-radius:99px;
    background:linear-gradient(90deg, var(--accent), var(--accent-hover));
    animation:slide 1.6s ease-in-out infinite;
  }
  .loader-track i.determinate { animation:none; transition:width .4s; width:0; }
  .loader-stat { font:11px/1.5 var(--mono); color:var(--text-muted); min-height:2.8em; }
  @keyframes slide { 0%{transform:translateX(-110%)} 100%{transform:translateX(560%)} }
</style>
</head>
<body>
<div id="stage">
  <div id="preload"><i></i></div>
  <video id="video" autoplay playsinline crossorigin="anonymous"></video>
  <div id="audio-wrap" hidden>
    <span>Озвучка:</span>
    <select id="audio-sel" aria-label="Вибір озвучки"></select>
  </div>
  <div id="hud" hidden></div>
  <div id="loader">
    <div class="loader-card">
      <div class="loader-logo">MyCinema <small>· плеєр</small></div>
      <div class="loader-sub" id="loader-sub">Підключення до потоку…</div>
      <div class="loader-track"><i id="loader-bar"></i></div>
      <div class="loader-stat" id="loader-stat">—</div>
    </div>
  </div>
</div>
<script src="src/player-overlay.js"></script>
<script src="src/player-controls.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var src = params.get('src') || '';
  var title = params.get('title') || 'MyCinema';
  var variants = [];
  try { variants = JSON.parse(params.get('playlist') || '[]') || []; } catch (e) {}
  if (!variants.length && src) {
    variants = [{ url: src, season: '', episode: '', translation: '', quality: '' }];
  }
  if (!src && variants[0]) src = variants[0].url;
  var desiredAudioLang = '';
  var controls = null;
  var stage = document.getElementById('stage');
  var video = document.getElementById('video');
  function setTitle(v) {
    var suffix = [v && v.season, v && v.episode].filter(Boolean).join(' · ');
    var text = title + (suffix ? ' · ' + suffix : '');
    if (controls) controls.setTitle(text);
    else document.title = text;
  }
  var hud = document.getElementById('hud');
  var preloadBar = document.querySelector('#preload i');
  var loader = document.getElementById('loader');
  var loaderSub = document.getElementById('loader-sub');
  var loaderStat = document.getElementById('loader-stat');
  var loaderBar = document.getElementById('loader-bar');
  var hideTimer = null;
  var loaderHidden = false;
  var hlsInstance = null, statsStarted = false, pendingSeek = 0;

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (stage.requestFullscreen) stage.requestFullscreen();
  }

  function hideLoader() {
    if (loaderHidden) return;
    loaderHidden = true;
    loader.classList.add('hidden');
    setTimeout(function () { loader.remove(); }, 500);
  }
  function showLoaderError(text) {
    loaderSub.textContent = text;
    loaderSub.style.color = 'var(--danger)';
    loaderBar.classList.remove('determinate');
  }

  /* HUD разом із контролами плеєра */
  function showHud() {
    hud.hidden = false;
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () { if (!video.paused) hud.hidden = true; }, 3500);
  }
  ['mousemove','touchstart','keydown','click'].forEach(function (ev) {
    document.addEventListener(ev, showHud, { passive:true });
  });
  video.addEventListener('play', showHud);
  video.addEventListener('pause', showHud);
  video.addEventListener('loadeddata', hideLoader);
  video.addEventListener('playing', hideLoader);

  function fmtBytes(n) {
    if (!isFinite(n) || n < 0) return '—';
    if (n >= 1048576) return (n/1048576).toFixed(1)+' MB';
    if (n >= 1024) return (n/1024).toFixed(0)+' KB';
    return n.toFixed(0)+' B';
  }
  function badge(text) { var s=document.createElement('span'); s.textContent=text; return s; }

  /* Вибір озвучки: TorrServer віддає список доріжок через /gst/<hash>/probe */
  function sourceInfo() {
    try {
      var u = new URL(src, location.href);
      var m = u.pathname.match(/\/gst\/([^/]+)\//);
      return { u: u, hash: m ? m[1] : (u.searchParams.get('link') || ''),
        index: u.searchParams.get('index') || '1' };
    } catch (e) { return null; }
  }

  function initAudioTracks() {
    var info = sourceInfo();
    if (!info || !info.hash) return;
    var endpoint = info.u.origin + '/gst/' + encodeURIComponent(info.hash) +
      '/probe?index=' + encodeURIComponent(info.index);
    fetch(endpoint, { cache:'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !Array.isArray(d.Tracks)) return;
        var wrap = document.getElementById('audio-wrap');
        var sel = document.getElementById('audio-sel');
        var found = false, ukIdx = -1;
        sel.replaceChildren();
        d.Tracks.forEach(function (t, i) {
          var isAudio = t.Type === 'audio' || /^audio\//.test(t.CapsName || '');
          if (!isAudio) return;
          var label = t.Title || t.Language || ('Доріжка ' + i);
          var opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = label;
          sel.append(opt);
          found = true;
          if (/^(uk|ua)/i.test(t.Language || '') || /укр|ukr/i.test(label)) {
            if (ukIdx < 0) ukIdx = i;
          }
        });
        if (!found) return;
        sel.value = String(ukIdx >= 0 ? ukIdx : Number(info.u.searchParams.get('audio') || 0));
        wrap.hidden = false;
        sel.onchange = function () { switchAudio(Number(sel.value)); };
      })
      .catch(function () {});
  }

  function switchAudio(idx) {
    var info = sourceInfo();
    if (!info) return;
    var next = new URL(info.u.href);
    next.searchParams.set('audio', String(idx));
    loadUrl(next.href, true);
  }

  /* Єдина точка зміни джерела: і для оверлею, і для вибору аудіодоріжки. */
  function loadUrl(url, keepTime) {
    try { pendingSeek = keepTime ? (video.currentTime || 0) : 0; } catch (e) { pendingSeek = 0; }
    src = url;
    if (hlsInstance) hlsInstance.loadSource(src);
    else { video.src = src; video.load(); }
    video.play().catch(function () {});
  }

  function loadVariant(v, keepTime) {
    if (!v || !v.url) return;
    desiredAudioLang = v.audioLang || '';
    setTitle(v);
    loadUrl(v.url, keepTime);
  }

  function applyHlsAudio() {
    if (!hlsInstance || !desiredAudioLang) return;
    var list = hlsInstance.audioTracks || [];
    for (var i = 0; i < list.length; i++) {
      var t = list[i] || {};
      var lang = String(t.lang || '').toLowerCase();
      if (lang.indexOf(desiredAudioLang.toLowerCase()) === 0 || /укр|ukr/i.test(t.name || '')) {
        try { hlsInstance.audioTrack = i; } catch (e) {}
        return;
      }
    }
  }

  var overlay = null;
  var currentVariant = variants[0] || null;
  function mountUI() {
    if (controls) return;
    if (window.MCPlayerOverlay && variants.length) {
      overlay = window.MCPlayerOverlay.mount({
        host: stage,
        variants: variants,
        initial: currentVariant,
        onSwitch: function (v) {
          var sameEpisode = currentVariant &&
            String(currentVariant.season || '') === String(v.season || '') &&
            String(currentVariant.episode || '') === String(v.episode || '');
          currentVariant = v;
          /* Нова серія — з початку; якість/озвучка тієї самої серії — без перемотки. */
          loadVariant(v, sameEpisode);
        }
      });
    }
    if (window.MCPlayerControls) {
      controls = window.MCPlayerControls.mount({
        host: stage,
        video: video,
        title: title,
        onMenu: overlay && overlay.hasOptions() ? function () { overlay.toggle(); } : null,
        onFullscreen: toggleFullscreen,
        onBack: function () { window.close(); }
      });
    }
    setTitle(variants[0]);
  }

  function initStats() {
    if (statsStarted) return;
    statsStarted = true;
    var u;
    try { u = new URL(src, location.href); } catch(e) { return; }
    var m = u.pathname.match(/\/gst\/([^/]+)\//);
    var hash = m ? m[1] : (u.searchParams.get('link') || '');
    if (!hash) return;
    var endpoint = u.origin + '/gst/' + encodeURIComponent(hash) + '/heartbeat?index=' +
      encodeURIComponent(u.searchParams.get('index') || '1');
    var lastBytes=null, lastTs=0;

    setInterval(function () {
      fetch(endpoint, { cache:'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d) return;
          var t = d.Torrent || {}, now = Date.now(), speed='—';
          if (lastBytes !== null && lastTs) {
            var delta=(t.bytes_read_data||0)-lastBytes, secs=(now-lastTs)/1000;
            if (secs>0 && delta>=0) speed=fmtBytes(delta/secs)+'/s';
          }
          lastBytes=t.bytes_read_data||0; lastTs=now;
          var pct=(t.torrent_size ? (t.preloaded_bytes||0)/t.torrent_size*100 : 0);
          preloadBar.style.width=Math.min(100,Math.max(0,pct)).toFixed(1)+'%';

          hud.replaceChildren(
            badge(d.stat_string || '—'),
            badge('⬇ '+speed),
            badge('📦 '+pct.toFixed(1)+'%'),
            badge('🧠 '+fmtBytes(d.Filled||0)+'/'+fmtBytes(d.Capacity||0)),
            badge('👥 '+(t.active_peers||0)+'/'+(t.total_peers||0)),
            badge('🌱 '+(t.connected_seeders||0))
          );
          if (!loaderHidden) {
            loaderBar.classList.add('determinate');
            loaderBar.style.width=Math.min(100,Math.max(4,pct)).toFixed(1)+'%';
            loaderSub.textContent='Буфер потокy · '+pct.toFixed(1)+'%';
            loaderStat.textContent=(d.stat_string||'—')+' · ⬇ '+speed+' · 👥 '+(t.active_peers||0)+'/'+ (t.total_peers||0);
          }
          showHud();
        })
        .catch(function () {});
    }, 2000);
  }

  if (!src) { showLoaderError('Немає джерела'); return; }

  setTimeout(function () { if (!loaderHidden) loaderSub.textContent='Ще трохи… перші кадри готуються'; }, 8000);

  function start(Hls) {
    if (Hls && Hls.isSupported()) {
      var hls = new Hls({ enableWorker:true });
      hls.loadSource(src);
      hls.attachMedia(video);
      hlsInstance = hls;
      initAudioTracks();
      if (variants[0]) { desiredAudioLang = variants[0].audioLang || ''; setTitle(variants[0]); }
      mountUI();
      hls.on(Hls.Events.ERROR, function (_e, data) {
        if (data && data.fatal) showLoaderError('Помилка потоку: '+(data.details||'unknown'));
      });
      hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, applyHlsAudio);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        if (pendingSeek > 0) { try { video.currentTime = pendingSeek; } catch (e) {} pendingSeek = 0; }
        applyHlsAudio();
        video.play().catch(function () {});
        initStats();
      });
    } else {
      video.src = src;
      if (variants[0]) { desiredAudioLang = variants[0].audioLang || ''; setTitle(variants[0]); }
      mountUI();
      video.addEventListener('loadedmetadata', function () {
        if (pendingSeek > 0) { try { video.currentTime = pendingSeek; } catch (e) {} pendingSeek = 0; }
        video.play().catch(function(){}); initAudioTracks(); initStats();
      });
    }
  }

  if (window.Hls) start(window.Hls);
  else {
    var s = document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js';
    s.onload=function(){ start(window.Hls); };
    s.onerror=function(){ showLoaderError('Не вдалося завантажити hls.js'); };
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
